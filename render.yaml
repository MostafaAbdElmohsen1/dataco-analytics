# Render blueprint. Commit this at the repo root and Render will read it.
#
# GEMINI_API_KEY: sync: false يعني Render مش هيحط قيمتها في الريبو -
# لازم تدخل Render Dashboard -> Environment -> تضيفها يدوياً بعد أول
# deploy. متحطش المفتاح نفسه في أي ملف بيتعمله git push.
services:
  - type: web
    name: dataco-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python build_db.py
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: "gemini-3.5-flash-lite"
