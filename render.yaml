# Render blueprint. Commit this at the repo root and Render will read it.
services:
  - type: web
    name: dataco-analytics
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python build_db.py
    startCommand: gunicorn app:server --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
