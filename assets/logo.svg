<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40" role="img" aria-label="Meridian Retail Group">
  <defs>
    <linearGradient id="mrg" x1="6" y1="4" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF0080"/>
      <stop offset="0.55" stop-color="#D63BC8"/>
      <stop offset="1" stop-color="#8F3FE0"/>
    </linearGradient>
  </defs>
  <!-- الكرة: دايرة خارجية + قوس رأسي جواها = خط الزوال (meridian) -->
  <circle cx="20" cy="20" r="14" fill="none" stroke="url(#mrg)" stroke-width="2.4"/>
  <ellipse cx="20" cy="20" rx="6.6" ry="14" fill="none" stroke="url(#mrg)" stroke-width="2.4"/>
</svg>
